<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FinScope Agent</title>
    <link rel="stylesheet" href="/widget-assets/widget.css?v=4" />
  </head>
  <body>
    <main class="agent-shell">
      <header class="agent-header">
        <div class="agent-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="agent-identity">
          <strong id="agent-title">市场状态 Agent</strong>
          <span id="context-label">等待页面上下文</span>
        </div>
        <div class="agent-state">
          <span class="read-only-badge">只读</span>
          <span class="agent-status" id="agent-status">就绪</span>
        </div>
      </header>
      <section class="conversation" id="conversation" aria-live="polite" aria-busy="false">
        <div class="intro compact-intro" id="compact-intro">
          <span>READ-ONLY RESEARCH</span>
          <h1>从页面判断，追到真实证据。</h1>
          <p>我会按需读取市场状态、机会、宽度或历史快照，并标明数据日期与质量。</p>
          <div class="suggestions">
            <button type="button">今天为什么是这个市场阶段？</button>
            <button type="button">当前机会最缺什么确认？</button>
            <button type="button">和上一交易日相比有什么变化？</button>
          </div>
        </div>
        <div class="intro workspace-intro" id="workspace-intro">
          <div class="workspace-thesis">
            <span>FIN//SCOPE EVIDENCE DESK</span>
            <h1>把研究问题放上桌面，沿证据走到结论。</h1>
            <p>可读取采集、研究、知识、新闻、市场、自选、财务、产业链、策略、持仓与量化数据。页面只提供方向，回答依据来自实时只读查询。</p>
            <div class="suggestions workspace-suggestions">
              <button type="button">概括最近进入工作区的文章与研究线索</button>
              <button type="button">结合自选、新闻和证据，哪些主题最值得继续补证？</button>
              <button type="button">查找一家公司的财务、产业链与已有研究材料</button>
            </div>
          </div>
          <aside class="evidence-boundary" aria-label="只读研究边界">
            <strong>研究边界</strong>
            <dl>
              <div><dt>证据</dt><dd>固定 GET 接口</dd></div>
              <div><dt>范围</dt><dd>本地 FinScope</dd></div>
              <div><dt>动作</dt><dd>不写入 · 不刷新</dd></div>
            </dl>
          </aside>
        </div>
      </section>
      <form class="composer" id="composer">
        <label for="question" id="question-label">追问当前市场状态</label>
        <div><textarea id="question" rows="2" maxlength="4000" placeholder="例如：哪些行业只是短期反弹？"></textarea><button type="button" id="send">发送</button></div>
        <small id="composer-note">只读分析 · 不执行交易或修改 FinScope 数据</small>
      </form>
    </main>
    <script src="/widget-assets/markdown.js?v=4" defer></script>
    <script src="/widget-assets/widget.js?v=4" defer></script>
  </body>
</html>
